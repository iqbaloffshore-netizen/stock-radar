name: Stock Pro Master Radar

on:
  schedule:
    # Mon-Fri: 8:00 AM IST (2:30 UTC)
    - cron: '30 2 * * 1-5'
    # Mon-Fri: 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * 1-5'
    # Sat-Sun: 7:00 PM IST (13:30 UTC) - Weekend Briefing
    - cron: '30 13 * * 0,6'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nsepython beautifulsoup4 yfinance pandas feedparser requests lxml
          
      - name: Run Master Radar Script
        run: python master_radar.py
