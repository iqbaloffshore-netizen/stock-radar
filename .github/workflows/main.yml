name: Iqbal Master Radar

on:
  schedule:
    # Rozana Subah 8:00 AM IST (Mon-Fri)
    - cron: '30 2 * * 1-5'
    # Rozana Shaam 6:00 PM IST (Mon-Fri)
    - cron: '30 12 * * 1-5'
  # Manual test ke liye button
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nsepython beautifulsoup4 yfinance pandas feedparser requests
          
      - name: Run Master Radar Script
        run: python master_radar.py
